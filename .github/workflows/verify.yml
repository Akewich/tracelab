name: Verify TraceLab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracelab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      BACKEND_URL: http://localhost:4000
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, types, and tests
        run: pnpm check

      - name: Build both applications
        run: pnpm build

      - name: Start Jaeger and Grafana
        run: docker compose up -d

      - name: Start Next.js and the backend
        shell: bash
        run: |
          node scripts/dev.mjs > "$RUNNER_TEMP/tracelab-app.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/tracelab-app.pid"

      - name: Wait for application and observability services
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/lab > /dev/null &&
               curl --fail --silent --max-time 5 http://127.0.0.1:4000/health > /dev/null &&
               curl --fail --silent --max-time 5 http://127.0.0.1:16686/api/services > /dev/null &&
               curl --fail --silent --max-time 5 http://127.0.0.1:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "One or more TraceLab services did not become ready. See uploaded logs."
          exit 1

      - name: Verify real distributed traces and Grafana queries
        run: pnpm verify:live

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          docker compose ps > "$RUNNER_TEMP/tracelab-compose-status.log" 2>&1 || true
          docker compose logs --no-color > "$RUNNER_TEMP/tracelab-infra.log" 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracelab-verification-logs
          path: |
            ${{ runner.temp }}/tracelab-app.log
            ${{ runner.temp }}/tracelab-compose-status.log
            ${{ runner.temp }}/tracelab-infra.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/tracelab-app.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/tracelab-app.pid")" || true
          fi
          docker compose down --volumes || true
